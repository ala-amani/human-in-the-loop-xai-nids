name: Live Ollama Qwen3 Audit
on:
  push:
    paths:
      - '.github/workflows/live-ollama-audit.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  ollama-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Python dependencies
        run: |
          python -m pip install -e . pytest scapy
          python -m pytest -q tests/test_generative_explainer.py tests/test_llm_ui_commentary.py
      - name: Install and start local Ollama
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --show-error --silent --location --retry 4 'https://ollama.com/install.sh' | sh
          ollama serve > /tmp/ollama-local-server.log 2>&1 &
          for attempt in $(seq 1 120); do
            if curl --silent --fail http://127.0.0.1:11434/api/tags >/dev/null; then
              break
            fi
            sleep 2
          done
          curl --fail --silent --show-error http://127.0.0.1:11434/api/tags
          ollama pull qwen3:4b
          ollama list
      - name: Run live Ollama audit
        run: |
          PYTHONPATH=. python experiments/2026-10-19-live-ollama-audit/live_model_audit.py --model qwen3:4b --timeout 240 --output-dir experiments/2026-10-19-live-ollama-audit/run_outputs
      - name: Upload real model outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qwen3-4b-live-audit
          path: experiments/2026-10-19-live-ollama-audit/run_outputs
          if-no-files-found: warn
      - name: Commit audit results
        if: success()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add experiments/2026-10-19-live-ollama-audit/run_outputs
          git commit -m 'Archive live Qwen3 Ollama audit results'
          git push
