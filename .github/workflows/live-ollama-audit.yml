name: Live Ollama Qwen3 Audit
on:
  push:
    paths:
      - '.github/workflows/live-ollama-audit.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  ollama-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Python dependencies
        run: |
          python -m pip install -e . pytest scapy
          python -m pytest -q tests/test_generative_explainer.py tests/test_llm_ui_commentary.py
      - name: Start Ollama container
        run: |
          docker run -d --name local-ollama -p 11434:11434 ollama/ollama:latest
          docker exec local-ollama ollama pull qwen3:4b
          docker exec local-ollama ollama list
      - name: Run live Ollama audit
        run: |
          python experiments/2026-10-19-live-ollama-audit/live_model_audit.py --model qwen3:4b --timeout 240 --output-dir experiments/2026-10-19-live-ollama-audit/run_outputs
      - name: Upload real model outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qwen3-4b-live-audit
          path: experiments/2026-10-19-live-ollama-audit/run_outputs
          if-no-files-found: warn
      - name: Commit audit results
        if: success()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add experiments/2026-10-19-live-ollama-audit/run_outputs
          git commit -m 'Archive live Qwen3 Ollama audit results'
          git push
